          queue = await (await fetch('/api/animation/jobs')).json();
          for (const j of queue) {
            if (!mine.has(j.job) || !(j.done || j.error)) continue;
            mine.delete(j.job);
            if (j.done) {
              const blob = await jobBlob(j);
              download(`${j.name}.mp4`, blob);
              toast(`Video ready: ${j.name}.mp4`);
              // Still looking at it: the preview becomes the video file itself.
              if ($('export-dlg').open && xp.format === 'mp4' && xp.lastJob === j.job) {
                xp.token++;
                const url = URL.createObjectURL(blob);
                setPreview(Object.assign(document.createElement('video'), { src: url, controls: true, autoplay: true, loop: true, muted: true, playsInline: true }), `${jobAbout(j)} · ${kb(j.bytes || blob.size)} · the downloaded file`, url);
              }
            } else toast(`Video failed: ${j.error}`);
          }
          queueUi();
          if (!queue.some((j) => !j.done && !j.error)) break;
          await new Promise((r) => setTimeout(r, 600));
        }
      } catch {} finally {
        polling = false;
      }
    }
    function queueUi() {
      const running = queue.filter((j) => !j.done && !j.error), ready = queue.filter((j) => j.done);
      $('queue-btn').hidden = !queue.length && !exported.length;
      $('queue-btn').firstChild.hidden = !running.length;
      const files = ready.length + exported.length;
      $('queue-btn').lastChild.textContent = running.length ? `Rendering ${jobPct(running[0])}%${running.length > 1 ? ` (+${running.length - 1})` : ''}` : `${files} export${files === 1 ? '' : 's'}`;
      if ($('export-dlg').open) {
        formatNav();
        renderProgress();
        if (xp.format === 'queue') showQueue();
      }
    }
    // While this diagram's latest video renders, its progress shows over the video preview.
    function renderProgress() {
      const j = xp.format === 'mp4' && queue.find((x) => x.job === xp.lastJob && !x.done && !x.error);
      $('x-render').hidden = $('x-progress').hidden = !j;
      if (!j) return;
      const p = j.progress || 0, secs = (Date.now() - j.started) / 1000, left = p > 0.05 && p < 1 ? Math.round((secs * (1 - p)) / p) : null;
      $('x-render').lastChild.textContent = jobState(j) + (left != null ? ` · about ${left < 60 ? `${Math.max(1, left)} s` : `${Math.round(left / 60)} min`} left` : '');
      $('x-progress').classList.toggle('busy', !(p > 0 && p < 1));
      $('x-progress').firstChild.style.width = p > 0 && p < 1 ? `${jobPct(j)}%` : '';
    }
    function showQueue() {
      const list = Object.assign(document.createElement('div'), { className: 'xqueue' });
      const button = (text, onclick) => Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: text, onclick });
      if (!queue.length && !exported.length) list.append(Object.assign(document.createElement('p'), { textContent: 'Nothing exported yet. Videos render here and keep going even if you close this; every file you download shows up here too.' }));
      if (queue.length) list.append(Object.assign(document.createElement('h4'), { textContent: 'Videos' }));
      for (const j of queue) {
        const row = Object.assign(document.createElement('div'), { className: `xjob${j.error ? ' err' : ''}` });
        const acts = Object.assign(document.createElement('div'), { className: 'acts' });
        if (j.done) acts.append(button('Download', async () => download(`${j.name}.mp4`, await jobBlob(j))));
        if (j.done || j.error) acts.append(button('Remove', async () => { await fetch(`/api/animation?job=${j.job}`, { method: 'DELETE' }); fetched.delete(j.job); queue = queue.filter((x) => x !== j); queueUi(); }));
        row.append(Object.assign(document.createElement('b'), { textContent: `${j.name}.mp4` }), acts, Object.assign(document.createElement('small'), { textContent: `${jobAbout(j)} · ${jobState(j)}` }));
        if (!j.done && !j.error) {
          const bar = Object.assign(document.createElement('div'), { className: 'bar' });
          bar.append(Object.assign(document.createElement('i'), { style: `width:${Math.max(3, jobPct(j))}%` }));
          row.append(bar);
        }
        list.append(row);
      }
      if (exported.length) list.append(Object.assign(document.createElement('h4'), { textContent: 'Downloaded from this tab' }));
      for (const f of exported) {
        const row = Object.assign(document.createElement('div'), { className: 'xjob' });
        const acts = Object.assign(document.createElement('div'), { className: 'acts' });
        acts.append(button('Download again', () => download(f.name, f.blob, null, true)), button('Remove', () => { exported.splice(exported.indexOf(f), 1); queueUi(); }));
        row.append(Object.assign(document.createElement('b'), { textContent: f.name }), acts, Object.assign(document.createElement('small'), { textContent: `${kb(f.blob.size)} · ${f.at.toLocaleTimeString()}` }));
        list.append(row);
      }
      setPreview(list, queue.length ? 'Videos render on this computer; finished ones stay until you remove them. Other files stay while this tab is open.' : exported.length ? 'Files stay here while this tab is open.' : '');
    }
    pollQueue(); // videos still rendering (or ready) from before a reload

    // ---- light / dark ----

    const media = matchMedia('(prefers-color-scheme: dark)');
    const isDark = () => theme === 'dark' || (theme === 'auto' && media.matches);
    const THEMES = { auto: ['◐', 'Theme: follows your system'], light: ['☀', 'Theme: light'], dark: ['☾', 'Theme: dark'] };
    function applyTheme() {
      document.body.classList.toggle('dark', isDark());
      $('theme-btn').textContent = THEMES[theme][0];
      $('theme-btn').title = `${THEMES[theme][1]} (click to change)`;
      applyStyle(styleId);
    }
    $('theme-btn').onclick = () => {
      theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme];
      store.set('giotto-theme', theme);
      applyTheme();
    };
    media.addEventListener('change', applyTheme);

    // ---- styles: how every diagram looks; one is active at a time ----

    // A few dots showing a style's colors: background, its tone fills, its lines.
    function swatches(s) {
      const box = document.createElement('span');
      box.className = 'sws';
      const colors = [s.background, ...Object.values(s.tones).slice(0, 4).map((t) => t.fill), s.stroke];
      for (const c of colors) {
        const dot = document.createElement('span');
        dot.className = 'sw';
        dot.style.background = c; // set through the DOM, so a style can't inject markup
        box.append(dot);
      }
      return box;
    }

    function setStyles(text) {
      stylesText = text;
      ({ styles, current: styleId } = JSON.parse(text));
      applyStyle(styleId);
    }

    function applyStyle(id) {
      styleId = styles[id] ? id : 'default';
      S = resolveStyle(styles[styleId], isDark());
      const name = document.createElement('span');
      name.textContent = styles[styleId]?.name || styleId; // not the default's name
      $('style-btn').replaceChildren(swatches(S), name, ' ▾');
      if (doc) sceneBar(); // the style decides whether there's a header and footer to show
      render();
      if (!$('gallery').hidden) showGallery();
    }

    function showGallery() {
      const preview = doc?.elements.length ? doc : SAMPLE;
      const cards = Object.entries(styles).map(([id, st]) => {
        const s = resolveStyle(st, isDark());
        const b = document.createElement('button');
        b.className = id === styleId ? 'on' : '';
        // Previews are images, so each style's own CSS stays inside its preview.
        const img = document.createElement('img');
        img.alt = '';
        img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(toSvg(preview, s))}`;
        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('strong');
        name.textContent = st.name || id;
        row.append(name, swatches(s));
        const about = document.createElement('small');
        about.textContent = st.description || '';
        b.append(img, row, about);
        b.onclick = () => {
          applyStyle(id); // instant here; the server tells other tabs
          fetch('/api/style', { method: 'PUT', body: JSON.stringify({ id }) });
        };
        return b;
      });
      const tip = document.createElement('p');
      tip.textContent = 'Want another look? Ask your agent to make a style, or to change one. Any change shows up on every diagram.';
      $('gallery').replaceChildren(...cards, tip);
      $('gallery').hidden = false;
    }

    $('style-btn').onclick = (ev) => {
      ev.stopPropagation();
      $('gallery').hidden ? showGallery() : ($('gallery').hidden = true);
    };
    document.addEventListener('pointerdown', (ev) => {
      if (!ev.target.closest('#gallery, #style-btn')) $('gallery').hidden = true;
    });

    // ---- start, then stay in sync: live pushes, plus a check every few seconds in case one is missed ----

    setStyles(await (await fetch('/api/styles')).text());
    applyTheme();
    await refreshList();
    const wanted = location.hash.slice(1);
    await open(diagrams.some((d) => d.id === wanted) ? wanted : diagrams[0]?.id);

    // Links the agent hands out (…/#<id>) open that diagram even in a tab that's already open.
    addEventListener('hashchange', () => open(location.hash.slice(1)));

    async function check() {
      try {
        await refreshList();
        // The open diagram was deleted (here, in another tab, or its file removed): go to the next one.
        if (current && !diagrams.some((d) => d.id === current)) {
          if (!diagrams.length) return location.reload(); // nothing left: start empty
          current = null;
        }
        if (!current && diagrams.length) await open(diagrams[0].id);
        if (current && !drag) {
          const res = await fetch(`/api/doc?id=${current}`);
          if (res.ok) show(await res.text());
        }
        const st = await (await fetch('/api/styles')).text();
        if (st !== stylesText) setStyles(st);
      } catch {
        status('canvas server stopped, retrying…');
      }
    }
    setInterval(check, 3000);

    const events = new EventSource(`/api/events?v=${version}`);
    events.onmessage = async (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'hello' && msg.version !== version) location.reload(); // Giotto was updated
      if (msg.type === 'styles' || msg.type === 'deleted') check();
      if (msg.type === 'doc') {
        if (msg.id === current) show(msg.text);
        // The agent is working on another diagram: follow it, unless the user is busy here.
        else if (Date.now() - lastInput > 5000) await open(msg.id);
        refreshList();
      }
    };
  </script>
</body>
</html>
