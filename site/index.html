<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giotto docs</title>
  <meta name="description" content="Diagrams your coding agent draws for you, live. The docs are a canvas: scroll to take the tour." />
  <meta property="og:title" content="Giotto: diagrams your agent draws" />
  <meta property="og:description" content="The docs are a canvas: scroll to take the tour." />
  <meta property="og:image" content="https://nicoloboschi.github.io/giotto/card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    /* Page colors follow the active Giotto style (set from script). */
    :root { --bg: #fbfaf7; --fg: #1f2937; --muted: #64748b; --panel: #ffffff; --line: #e4e0d6; --accent: #2563eb; --on-accent: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; user-select: none; }
    #cv.panning { cursor: grabbing; }
    #cv [data-id^="pg-"]:not([data-id="pg-note"]):not([data-id^="pg-ab"]):not([data-id^="pg-cb"]) { cursor: move; }
    #cv [data-id^="sty-"] { cursor: pointer; }
    #page { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; }

    .chrome { position: fixed; z-index: 5; display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    #top { left: 16px; top: 16px; padding: 7px 8px 7px 14px; }
    #top b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
    #top span { color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 30px; min-width: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
      background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-decoration: none; }
    .btn:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

    #rail { right: 16px; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: stretch; gap: 0; padding: 6px; max-height: calc(100% - 32px); overflow-y: auto; }
    #rail button { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; text-align: left; padding: 4px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    #rail button i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
    #rail button:hover { color: var(--fg); }
    #rail button.seen i { background: currentColor; opacity: .5; }
    #rail button.on { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); }
    #rail button.on i { background: var(--accent); border-color: var(--accent); opacity: 1; }

    #bottom { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px; }
    #bottom .count { color: var(--muted); font-size: 12px; padding: 0 6px; font-variant-numeric: tabular-nums; }
    #say { position: fixed; z-index: 4; left: 50%; bottom: 76px; transform: translateX(-50%); max-width: min(620px, calc(100% - 32px)); padding: 10px 14px; border-radius: 10px;
      background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.1); font-size: 15px; text-align: center; transition: opacity .3s; }
    #say[hidden] { display: block; opacity: 0; pointer-events: none; }
    #ask { position: fixed; z-index: 6; width: min(460px, calc(100% - 32px)); padding: 14px; display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
    #ask[hidden] { display: none; }
    #ask textarea, #ask pre { width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
    #ask textarea { font: inherit; resize: vertical; min-height: 44px; outline: 0; }
    #ask pre { max-height: 220px; overflow: auto; white-space: pre-wrap; }
    #ask .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
    #ask small { flex: 1; color: var(--muted); }
    @media (max-width: 760px) { #rail { display: none; } #top span { display: none; } #say { bottom: 70px; font-size: 14px; } }
  </style>
</head>
<body>
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Giotto documentation, drawn as one diagram"><g id="world"></g><g id="over"></g></svg>
    <iframe id="page" sandbox="allow-same-origin" title="An image made with Giotto" tabindex="-1"></iframe>
  </div>
  <div id="top" class="chrome">
    <b><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Giotto</b><span>docs</span>
    <button id="theme" class="btn" title="Light or dark">◐</button>
    <a class="btn" href="https://github.com/nicoloboschi/giotto" target="_blank" rel="noopener">GitHub</a>
  </div>
  <nav id="rail" class="chrome" aria-label="Stops"></nav>
  <div id="bottom" class="chrome">
    <button id="prev" class="btn" aria-label="Previous stop">↑</button>
    <span class="count" id="count"></span>
    <button id="next" class="btn primary"></button>
  </div>
  <div id="say" hidden></div>
  <div id="ask" hidden>
    <strong>What should change here?</strong>
    <textarea id="ask-text">Make the API bigger</textarea>
    <small>This is the note you'd paste to your agent:</small>
    <pre id="ask-note"></pre>
    <div class="row"><small id="ask-status"></small><button id="ask-close" class="btn">Close</button><button id="ask-copy" class="btn primary">Copy</button></div>
  </div>

  <script type="module">
    import { drawContent, resolve, bounds, labelOf, isRouted } from './lib/render.js';
    import { DEFAULT_STYLE, resolveStyle } from './lib/styles.js';
    import { timeline, frameAt } from './lib/scenes.js';
    import { pageHtml } from './lib/page.js';
    import { DOC, TOUR } from './docs.js';
    import { STYLES as MORE } from './styles.js';
    import { CARD } from './card.js';

    const $ = (id) => document.getElementById(id);
    const svg = $('cv');
    const STYLES = { default: DEFAULT_STYLE, ...MORE };
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

    // ---- the diagram and its look ----

    const doc = structuredClone(DOC);
    let styleId = STYLES[store.get('giotto-docs-style')] ? store.get('giotto-docs-style') : 'default';
    let dark = store.get('giotto-docs-theme') ? store.get('giotto-docs-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    let S, placed, views;
    const sceneStop = TOUR.findIndex((t) => t.id === 'st-scenes');
    const tl = timeline(doc);

    // Where each stop is: its frame, or for unframed stops the things in it.
    function measure() {
      placed = resolve(doc, S);
      const byId = Object.fromEntries(placed.map((e) => [e.id, e]));
      views = TOUR.map((t) => {
        const g = byId[t.id];
        if (t.framed) return bounds(g, S);
        const bs = g.children.map((c) => bounds(byId[c], S));
        const x = Math.min(...bs.map((b) => b.x)), y = Math.min(...bs.map((b) => b.y));
        return { x: x - 40, y: y - 40, w: Math.max(...bs.map((b) => b.x + b.w)) - x + 80, h: Math.max(...bs.map((b) => b.y + b.h)) - y + 80 };
      });
    }

    function applyStyle() {
      S = resolveStyle(STYLES[styleId], dark);
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries({ bg: S.background, fg: S.text, muted: S.tagText, panel: S.fill, line: S.groupStroke, accent: S.accent, 'on-accent': S.packetText })) root.setProperty(`--${k}`, v);
      // The style buttons at stop 08: the active one is lit.
      for (const id of Object.keys(STYLES)) {
        const e = doc.elements.find((x) => x.id === `sty-${id}`);
        if (e) e.tone = id === styleId ? 'blue' : undefined;
      }
      // The image at stop 12 is HTML in the same style (without the export header and footer).
      $('page').srcdoc = pageHtml({ html: CARD, width: 1200, height: 630 }, { ...STYLES[styleId], header: { show: false }, footer: { show: false } }, { dark });
      measure();
      drawn = null;
    }

    // ---- camera: the tour, plus wherever you dragged or zoomed ----

    let p = 0, target = 0; // position on the tour: 2.5 = halfway between stop 3 and stop 4
    let off = { x: 0, y: 0, zoom: 1 }, returning = false;
    const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
    function fitView(v) {
      const r = svg.getBoundingClientRect(), wide = r.width > 760;
      const W = r.width - (wide ? 230 : 24), H = r.height - 150; // room for the rail and the bottom bar
      const zoom = Math.min(W / v.w, H / v.h, 1.6);
      return { cx: v.x + v.w / 2, cy: v.y + v.h / 2, zoom, shift: wide ? -105 : 0 };
    }
    function camera() {
      const i = Math.max(0, Math.min(TOUR.length - 1, Math.floor(p))), f = ease(p - i);
      const a = fitView(views[i]), b = fitView(views[Math.min(i + 1, TOUR.length - 1)]);
      // Between stops the camera pulls back a little, like a flight.
      const zoom = (a.zoom + (b.zoom - a.zoom) * f) * (1 - 0.32 * Math.sin(Math.PI * f)) * off.zoom;
      const r = svg.getBoundingClientRect();
      const cx = a.cx + (b.cx - a.cx) * f + off.x, cy = a.cy + (b.cy - a.cy) * f + off.y;
      return { zoom, x: cx - (r.width / 2 + a.shift) / zoom, y: cy - (r.height / 2 - 20) / zoom, w: r.width / zoom, h: r.height / zoom };
    }
    let view = { x: 0, y: 0, zoom: 1, w: 1, h: 1 };

    // ---- drawing: the diagram changes rarely; the camera every frame ----

    let drawn = null, sceneT = 0, lastT = performance.now();
    function frame(now) {
      const dt = Math.min(64, now - lastT);
      lastT = now;
      p += (target - p) * Math.min(1, dt / 210);
      if (Math.abs(target - p) < 0.0005) p = target;
      if (returning) {
        const k = Math.min(1, dt / 160);
        off = { x: off.x * (1 - k), y: off.y * (1 - k), zoom: 1 + (off.zoom - 1) * (1 - k) };
        if (Math.abs(off.x) + Math.abs(off.y) < 0.5 && Math.abs(off.zoom - 1) < 0.002) (off = { x: 0, y: 0, zoom: 1 }), (returning = false);
      }
      view = camera();
      svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
      const st = $('stage').style;
      st.backgroundColor = S.background;
      st.backgroundImage = S.grid ? `radial-gradient(${S.grid} 1.3px, transparent 1.3px)` : 'none';
      st.backgroundSize = `${24 * view.zoom}px ${24 * view.zoom}px`;
      st.backgroundPosition = `${-view.x * view.zoom}px ${-view.y * view.zoom}px`;

      // Stop 09 plays its scene while you're there; everything else is a still.
      const playing = Math.abs(p - sceneStop) < 0.6;
      let fr = null;
      if (playing) {
        sceneT = (sceneT + dt) % tl.scenes[0].duration;
        fr = frameAt(doc, 0, sceneT, tl);
      }
      const key = playing ? `scene:${sceneT}` : 'still';
      if (key !== drawn) {
        $('world').innerHTML = drawContent(doc, S, fr ? { frame: fr } : { resolved: placed });
        drawn = key;
      }
      $('say').hidden = !fr?.say;
      if (fr?.say && $('say').textContent !== fr.say) $('say').textContent = fr.say;

      // The image sits on its slot, panned and zoomed with the canvas.
      const slot = placed.find((e) => e.id === 'img-slot');
      if (slot) {
        const z = view.zoom, scale = (slot.width / 1200) * z;
        Object.assign($('page').style, { width: '1200px', height: '630px', transform: `translate(${(slot.x - view.x) * z}px, ${(slot.y - view.y) * z}px) scale(${scale})` });
      }
      ui();
      requestAnimationFrame(frame);
    }

    // ---- the rail, the counter, next / previous ----

    const seen = new Set();
    let uiKey = '';
    function ui() {
      const at = Math.round(p);
      seen.add(at);
      const key = `${at}|${seen.size}|${styleId}`;
      if (key === uiKey) return;
      uiKey = key;
      [...$('rail').children].forEach((b, i) => {
        b.classList.toggle('on', i === at);
        b.classList.toggle('seen', seen.has(i));
        if (i === at) b.scrollIntoView({ block: 'nearest' });
      });
      $('count').textContent = `${at + 1} / ${TOUR.length}`;
      const last = at === TOUR.length - 1;
      $('next').textContent = last ? '↺  Back to the start' : `↓  ${String(at + 2).padStart(2, '0')} · ${TOUR[at + 1].title}`;
      $('prev').disabled = at === 0;
      if (Math.abs(p - target) < 0.01 && location.hash.slice(1) !== TOUR[at].id.slice(3)) history.replaceState(null, '', `#${TOUR[at].id.slice(3)}`);
    }
    $('rail').append(...TOUR.map((t, i) => {
      const b = document.createElement('button');
      b.innerHTML = '<i></i><span></span>';
      b.lastChild.textContent = `${String(i + 1).padStart(2, '0')} · ${t.title}`;
      b.onclick = () => go(i);
      return b;
    }));
    function go(i) {
      target = Math.max(0, Math.min(TOUR.length - 1, i));
      returning = true;
      closeAsk();
    }
    $('next').onclick = () => go(Math.round(target) === TOUR.length - 1 ? 0 : Math.round(target) + 1);
    $('prev').onclick = () => go(Math.round(target) - 1);

    // ---- input: scroll follows the path; drag looks around; Ctrl/⌘ + scroll zooms ----

    let settle;
    svg.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      if (ev.ctrlKey || ev.metaKey) {
        off.zoom = Math.min(4, Math.max(0.15, off.zoom * Math.exp(-ev.deltaY * 0.01)));
        returning = false;
        return;
      }
      target = Math.max(0, Math.min(TOUR.length - 1, target + (ev.deltaY + ev.deltaX * 0.5) / 700));
      returning = true;
      closeAsk();
      // When the scrolling stops, land on the nearest stop.
      clearTimeout(settle);
      settle = setTimeout(() => (target = Math.round(target)), 160);
    }, { passive: false });

    addEventListener('keydown', (ev) => {
      if (ev.target.tagName === 'TEXTAREA') return;
      const k = ev.key, at = Math.round(target);
      if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(k)) go(at + 1);
      else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(k)) go(at - 1);
      else if (k === 'Home') go(0);
      else if (k === 'End') go(TOUR.length - 1);
      else if (k === 'Escape') closeAsk();
      else return;
      ev.preventDefault();
    });

    const toWorld = (ev) => {
      const r = svg.getBoundingClientRect();
      return { x: view.x + (ev.clientX - r.left) / view.zoom, y: view.y + (ev.clientY - r.top) / view.zoom };
    };
    const inside = (pt, b) => pt.x >= b.x && pt.y >= b.y && pt.x <= b.x + b.w && pt.y <= b.y + b.h;
    let drag = null;
    svg.addEventListener('pointerdown', (ev) => {
      if (ev.button > 0) return;
      const id = ev.target.closest('[data-id]')?.dataset.id, pt = toWorld(ev);
      svg.setPointerCapture(ev.pointerId);
      // Touch: a vertical swipe moves along the tour.
      if (ev.pointerType === 'touch') return (drag = { type: 'swipe', y: ev.clientY, x: ev.clientX, t: target, ox: off.x });
      if (id?.startsWith('sty-')) return (drag = { type: 'style', id: id.slice(4) });
      const e = id && doc.elements.find((x) => x.id === id);
      if (e && ['pg-a', 'pg-b', 'pg-c', 'pg-wall'].includes(id)) return (drag = { type: 'box', e, sx: pt.x, sy: pt.y, x: e.x, y: e.y });
      const rq = placed.find((x) => x.id === 'rq-flow');
      if (rq && inside(pt, bounds(rq, S))) return (drag = { type: 'area', a: pt, b: pt });
      drag = { type: 'pan', sx: ev.clientX, sy: ev.clientY, ox: off.x, oy: off.y };
      returning = false;
      svg.classList.add('panning');
    });
    svg.addEventListener('pointermove', (ev) => {
      if (!drag) return;
      const pt = toWorld(ev);
      if (drag.type === 'swipe') target = Math.max(0, Math.min(TOUR.length - 1, drag.t + (drag.y - ev.clientY) / 260));
      if (drag.type === 'pan') (off.x = drag.ox - (ev.clientX - drag.sx) / view.zoom), (off.y = drag.oy - (ev.clientY - drag.sy) / view.zoom);
      if (drag.type === 'box') {
        drag.e.x = Math.round(drag.x + pt.x - drag.sx);
        drag.e.y = Math.round(drag.y + pt.y - drag.sy);
        placed = resolve(doc, S); // arrows re-route as you drag
        drawn = null;
      }
      if (drag.type === 'area') {
        drag.b = pt;
        drawArea(drag);
      }
    });
    const endDrag = () => {
      const d = drag;
      drag = null;
      svg.classList.remove('panning');
      if (d?.type === 'swipe') target = Math.round(target), (returning = true);
      if (d?.type === 'style') {
        styleId = d.id;
        store.set('giotto-docs-style', styleId);
        applyStyle();
      }
      if (d?.type === 'box') measure();
      if (d?.type === 'area') ask(d);
    };
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);

    $('theme').onclick = () => {
      dark = !dark;
      store.set('giotto-docs-theme', dark ? 'dark' : 'light');
      applyStyle();
    };

    // ---- stop 10: draw an area, get the note you'd paste to your agent (the same format as the canvas) ----

    const box = (d) => ({ x: Math.min(d.a.x, d.b.x), y: Math.min(d.a.y, d.b.y), w: Math.abs(d.b.x - d.a.x), h: Math.abs(d.b.y - d.a.y) });
    function drawArea(d) {
      if (!d) return ($('over').innerHTML = '');
      const r = box(d), z = view.zoom;
      $('over').innerHTML = `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="4" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="${1.6 / z}" stroke-dasharray="${6 / z} ${4 / z}"/>`;
    }
    let asking = null;
    function note() {
      const r = asking, n = Math.round;
      const items = placed.filter((e) => !e.id.startsWith('st-') && !e.id.startsWith('path-')).filter((e) => {
        const b = bounds(e, S);
        return b.x >= r.x && b.y >= r.y && b.x + b.w <= r.x + r.w && b.y + b.h <= r.y + r.h;
      });
      const what = items.map((e) => {
        const label = labelOf(e) ? ` "${labelOf(e).split('\n')[0]}"` : '';
        if (isRouted(e)) return `   - ${e.type}${label} (id: ${e.id}) from ${e.start.id} to ${e.end.id}`;
        const b = bounds(e, S);
        return `   - ${e.type}${label} (id: ${e.id}) at x ${n(b.x)}, y ${n(b.y)}, size ${n(b.w)}×${n(b.h)}`;
      });
      return [`Requested changes (1) for Giotto diagram "Giotto docs" (id: docs):`, '', `1. ${$('ask-text').value.trim() || '…'}`,
        `   Area x ${n(r.x)}..${n(r.x + r.w)}, y ${n(r.y)}..${n(r.y + r.h)}, containing:`, ...(what.length ? what : ['   (empty space)'])].join('\n');
    }
    function ask(d) {
      const r = box(d);
      if (r.w * view.zoom < 6 && r.h * view.zoom < 6) return drawArea(null);
      asking = r;
      $('ask-note').textContent = note();
      $('ask-status').textContent = '';
      const left = Math.min(innerWidth - 476, Math.max(16, (r.x + r.w - view.x) * view.zoom + 14));
      const top = Math.min(innerHeight - 380, Math.max(16, (r.y - view.y) * view.zoom));
      Object.assign($('ask').style, { left: `${left}px`, top: `${top}px` });
      $('ask').hidden = false;
      $('ask-text').select();
    }
    function closeAsk() {
      $('ask').hidden = true;
      asking = null;
      drawArea(null);
    }
    $('ask-text').addEventListener('input', () => asking && ($('ask-note').textContent = note()));
    $('ask-close').onclick = closeAsk;
    $('ask-copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(note());
        $('ask-status').textContent = 'Copied. With Giotto, your agent gets this.';
      } catch {
        $('ask-status').textContent = 'Could not copy';
      }
    };

    // ---- start: at the stop in the link, if any ----

    applyStyle();
    const startAt = TOUR.findIndex((t) => t.id === `st-${location.hash.slice(1)}`);
    p = target = Math.max(0, startAt);
    addEventListener('resize', () => (drawn = null));
    // Links to a stop (…/#styles) fly there, even in an open tab.
    addEventListener('hashchange', () => {
      const i = TOUR.findIndex((t) => t.id === `st-${location.hash.slice(1)}`);
      if (i >= 0) go(i);
    });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
