<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giotto: diagrams your agent draws</title>
  <meta name="description" content="Diagrams your coding agent draws for you, live. This page is one Giotto diagram, played: scroll to follow along." />
  <meta property="og:title" content="Giotto: diagrams your agent draws" />
  <meta property="og:description" content="This page is one Giotto diagram, played: scroll to follow along." />
  <meta property="og:image" content="https://nicoloboschi.github.io/giotto/card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { --bg: #fbfaf7; --fg: #1f2937; --muted: #64748b; --panel: #ffffff; --line: #e4e0d6; --accent: #2563eb; --on-accent: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
    #world { transform-origin: 0 0; will-change: transform; }
    .chrome { position: fixed; z-index: 5; display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    #top { left: 16px; top: 16px; padding: 7px 8px 7px 14px; }
    #top b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
    #top a.src { color: var(--muted); text-decoration: none; font-size: 12.5px; padding: 0 4px; }
    #top a.src:hover { color: var(--fg); text-decoration: underline; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 30px; min-width: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
      background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    #rail { right: 16px; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: stretch; gap: 0; padding: 6px; max-height: calc(100% - 32px); overflow-y: auto; }
    #rail button { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; text-align: left; padding: 4px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    #rail button i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
    #rail button:hover { color: var(--fg); }
    #rail button.seen i { background: currentColor; opacity: .5; }
    #rail button.on { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); }
    #rail button.on i { background: var(--accent); border-color: var(--accent); opacity: 1; }
    #bottom { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px; max-width: calc(100% - 32px); }
    #bottom .count { color: var(--muted); font-size: 12px; padding: 0 6px; font-variant-numeric: tabular-nums; }
    #next { overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
    #say { position: fixed; z-index: 4; left: 50%; bottom: 78px; transform: translateX(-50%); max-width: min(620px, calc(100% - 32px)); padding: 10px 14px; border-radius: 10px;
      background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.1); font-size: 15px; text-align: center; transition: opacity .3s; }
    #say[hidden] { display: block; opacity: 0; pointer-events: none; }
    @media (max-width: 760px) { #rail { display: none; } #top a.src { display: none; } }
  </style>
</head>
<body>
  <div id="stage"><svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Giotto's docs: one Giotto diagram, played"><g id="world"></g></svg></div>
  <div id="top" class="chrome">
    <b><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Giotto</b>
    <a class="src" href="giotto-docs.json" title="This page is this one Giotto diagram, played">the diagram</a>
    <a class="src" href="https://github.com/nicoloboschi/giotto/blob/main/docs/tour.svg" title="The same diagram, exported by Giotto as an animated SVG">as a video</a>
    <button id="theme" class="btn" title="Light or dark">◐</button>
    <a class="btn" href="https://github.com/nicoloboschi/giotto" target="_blank" rel="noopener">GitHub</a>
  </div>
  <nav id="rail" class="chrome" aria-label="Chapters"></nav>
  <div id="bottom" class="chrome">
    <button id="prev" class="btn" aria-label="Back">↑</button>
    <span class="count" id="count"></span>
    <button id="next" class="btn primary"></button>
  </div>
  <div id="say" hidden></div>

  <script type="module">
    // A small player for a Giotto diagram with scenes. It draws each moment with Giotto's own renderer (lib/);
    // scrolling plays the scene up to the next beat marked "wait". Everything on the page (the stops, the
    // terminals, the edits, the camera) is in giotto-docs.json, which Giotto also exports as docs/tour.svg.
    import { drawContent, drawOverlays, resolveFrame, cameraView, styleOf, bounds, defs } from './lib/render.js';
    import { DEFAULT_STYLE, resolveStyle } from './lib/styles.js';
    import { timeline, frameAt } from './lib/scenes.js';
    import { STYLES } from './styles.js';

    const $ = (id) => document.getElementById(id);
    const svg = $('cv');
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
    const doc = await (await fetch('./giotto-docs.json')).json();
    const styles = { default: DEFAULT_STYLE, ...STYLES };
    const tl = timeline(doc), scene = tl.scenes[0];
    let dark = store.get('giotto-docs-theme') ? store.get('giotto-docs-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

    // Where the player rests: before every beat that says "wait", and at the very end.
    const stops = [...scene.beats.filter((b, i) => b.wait && i > 0).map((b) => b.start - 1), scene.duration - 1]; // just before: resting there shows nothing of it yet
    const LAST = stops.length - 1;
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const chapterAt = (time) => tl.chapters.filter((c) => c.start <= time).at(-1);
    let t = 0, goal = 0; // the scene plays from t up to stops[goal], then rests
    const linked = tl.chapters.find((c) => slug(c.label) === location.hash.slice(1));
    if (linked) (t = linked.start), (goal = Math.max(0, stops.findIndex((s) => s > t)));

    // ---- one moment, drawn ----
    // Smooth means doing almost nothing per frame: layouts are cached (lib/render.js), the camera is one CSS
    // transform, and the drawing is split into one layer per stop: a frame redraws only the stops its beats
    // touch, and stops far off screen are hidden. Shadows are flat copies, not blur filters.
    const svgNS = 'http://www.w3.org/2000/svg';
    const world = $('world'), layers = new Map(), drawnMarkup = new Map();
    const overlay = document.createElementNS(svgNS, 'g');
    const styleCache = new Map();
    const styleFor = (frame) => {
      const id = `${frame?.style?.id || 'default'}|${dark}`;
      if (!styleCache.has(id)) styleCache.set(id, { ...resolveStyle(styleOf(frame, DEFAULT_STYLE, styles), dark), flatShadows: true });
      return styleCache.get(id);
    };
    // Which stop (top-level group) each element belongs to; links between stops go in a layer of their own.
    const roots = new WeakMap();
    function rootsOf(els) {
      if (roots.has(els)) return roots.get(els);
      const byId = Object.fromEntries(els.map((e) => [e.id, e])), parent = {};
      for (const g of els) if (g.type === 'group') for (const c of g.children || []) parent[c] ??= g.id;
      const top = (id) => {
        let r = id;
        for (let i = 0; parent[r] && i < 50; i++) r = parent[r];
        return r;
      };
      const of = new Map();
      for (const e of els) {
        const r = e.start ? (top(e.start.id) === top(e.end.id) ? top(e.start.id) : '_links') : e.type === 'note' && e.attachTo ? top(e.attachTo) : top(e.id);
        of.set(e.id, r);
      }
      const groups = new Map();
      for (const e of els) (groups.get(of.get(e.id)) || groups.set(of.get(e.id), []).get(of.get(e.id))).push(e);
      const box = new Map();
      for (const [r, list] of groups) {
        const bs = list.filter((e) => e.width !== undefined || e.points).map((e) => bounds(e, styleCache.values().next().value));
        if (bs.length) box.set(r, { x0: Math.min(...bs.map((b) => b.x)), y0: Math.min(...bs.map((b) => b.y)), x1: Math.max(...bs.map((b) => b.x + b.w)), y1: Math.max(...bs.map((b) => b.y + b.h)) });
      }
      const out = { of, groups, box };
      roots.set(els, out);
      return out;
    }
    const layer = (r) => {
      if (!layers.has(r)) {
        const g = document.createElementNS(svgNS, 'g');
        r === '_links' ? world.prepend(g) : world.insertBefore(g, overlay);
        layers.set(r, g);
      }
      return layers.get(r);
    };
    world.append(overlay);
    // The stops a beat changes: what it edits, types into, fills, lights, sends packets along.
    function touched(b, of) {
      const ids = [...(b.edit?.add || []).map((e) => e.id), ...(b.edit?.update || []).map((e) => e.id), ...(b.edit?.remove || []), b.term?.id, ...Object.keys(b.show || {}), ...(b.light || [])];
      for (const h of b.hops || []) ids.push(h.edge, h.from, h.to);
      return new Set(ids.filter(Boolean).map((id) => of.get(id)).filter(Boolean));
    }

    let lastT = -1, lastS = null, lastEls = null;
    let screen = svg.getBoundingClientRect(); // measured once (and on resize): measuring every frame forces a layout
    function draw() {
      const frame = frameAt(doc, 0, t, tl);
      const S = styleFor(frame);
      const els = resolveFrame(doc, S, frame);
      const r = screen, wide = r.width > 760;
      // The camera, fitted to the space left free by the chapters and the bottom bar: one transform.
      const W = r.width - (wide ? 220 : 0), H = r.height - 90;
      const v = cameraView(frame, els, S, W / H), z = W / v.w, top = v.y - 18 / z;
      world.style.transform = `translate(${-v.x * z}px, ${-top * z}px) scale(${z})`;
      const st = $('stage').style;
      st.backgroundSize = `${24 * z}px ${24 * z}px`;
      st.backgroundPosition = `${-v.x * z}px ${-top * z}px`;

      const { of, groups, box } = rootsOf(els);
      // Redraw everything after a jump or a new look; otherwise only what this beat (or one landing) touches.
      const jump = S !== lastS || t < lastT || t - lastT > 400 || els !== lastEls && !frame.morph && !scene.beats.some((b) => b.edit && b.start > lastT && b.start <= t);
      let dirty;
      if (jump) dirty = new Set(groups.keys());
      else {
        dirty = new Set();
        for (const b of scene.beats) if (b.start <= t && b.end + 1200 >= lastT && b.start <= t) for (const rt of touched(b, of)) dirty.add(rt);
      }
      if (S !== lastS) {
        st.backgroundColor = S.background;
        st.backgroundImage = S.grid ? `radial-gradient(${S.grid} 1.3px, transparent 1.3px)` : 'none';
        const root = document.documentElement.style;
        for (const [k, c] of Object.entries({ bg: S.background, fg: S.text, muted: S.tagText, panel: S.fill === 'transparent' ? S.background : S.fill, line: S.groupStroke, accent: S.accent, 'on-accent': S.packetText })) root.setProperty(`--${k}`, c);
      }
      const prev = frame.morph ? resolveFrame(doc, S, { ...frame, doc: frame.morph.from }) : null;
      const prevOf = prev && rootsOf(prev).of;
      for (const rt of dirty) {
        const subset = groups.get(rt) || [];
        const markup = drawContent(doc, S, { frame, resolved: subset, prev: prev && prev.filter((e) => prevOf.get(e.id) === rt), overlays: false });
        if (drawnMarkup.get(rt) !== markup) (layer(rt).innerHTML = markup), drawnMarkup.set(rt, markup);
      }
      for (const [rt, g] of layers) if (!groups.has(rt) && drawnMarkup.get(rt)) (g.innerHTML = ''), drawnMarkup.set(rt, '');
      // Lit boxes, packets and the pointer: small, redrawn while they move.
      const over = frame.active.length || frame.light.size || frame.pointer ? drawOverlays(frame, Object.fromEntries(els.map((e) => [e.id, e])), S) : '';
      if (over !== drawnMarkup.get('_over')) (overlay.innerHTML = over), drawnMarkup.set('_over', over);
      // Stops far off screen aren't painted at all.
      const vw = r.width / z, vh = r.height / z, mx = vw * 0.6, my = vh * 0.6;
      for (const [rt, g] of layers) {
        const b = box.get(rt);
        const visible = !b || rt === '_links' || (b.x1 > v.x - mx && b.x0 < v.x + vw + mx && b.y1 > top - my && b.y0 < top + vh + my);
        g.style.display = visible ? '' : 'none';
      }
      const say = frame.say?.trim();
      $('say').hidden = !say;
      if (say && $('say').textContent !== say) $('say').textContent = say;
      lastT = t;
      lastS = S;
      lastEls = els;
      ui();
    }

    // ---- the clock: runs until the next stop, then the picture holds ----
    let last = performance.now(), drawn = null;
    function tick(now) {
      const dt = Math.min(64, now - last);
      last = now;
      if (t < stops[goal]) t = Math.min(stops[goal], t + dt);
      if (t !== drawn) draw(), (drawn = t);
      requestAnimationFrame(tick);
    }

    // ---- forward and back ----
    function forward() {
      if (t < stops[goal]) t = stops[goal]; // still playing: land this part first
      else if (goal < LAST) goal++;
      else (t = 0), (goal = 0); // the end: start over
    }
    function back() {
      const rest = [0, ...stops].filter((s) => s < t - 1).at(-1) ?? 0;
      t = rest;
      goal = rest === 0 ? 0 : stops.indexOf(rest);
    }
    $('next').onclick = forward;
    $('prev').onclick = back;
    let cool = 0, acc = 0;
    addEventListener('wheel', (ev) => {
      ev.preventDefault();
      acc += ev.deltaY;
      const now = performance.now();
      if (Math.abs(acc) < 40 || now < cool) return;
      (acc > 0 ? forward : back)();
      acc = 0;
      cool = now + 450; // one gesture, one step (trackpads keep scrolling for a while)
    }, { passive: false });
    addEventListener('keydown', (ev) => {
      if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(ev.key)) forward();
      else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(ev.key)) back();
      else return;
      ev.preventDefault();
    });
    let swipe = null;
    svg.addEventListener('pointerdown', (ev) => (swipe = ev.clientY));
    svg.addEventListener('pointerup', (ev) => {
      if (swipe !== null && Math.abs(ev.clientY - swipe) > 40) (ev.clientY < swipe ? forward : back)();
      swipe = null;
    });
    $('theme').onclick = () => {
      dark = !dark;
      store.set('giotto-docs-theme', dark ? 'dark' : 'light');
      draw();
    };
    addEventListener('resize', () => ((screen = svg.getBoundingClientRect()), (lastS = null), draw()));

    // ---- the chapters, and what the next scroll does ----
    const seen = new Set();
    $('rail').append(...tl.chapters.map((c, i) => {
      const b = document.createElement('button');
      b.innerHTML = '<i></i><span></span>';
      b.lastChild.textContent = `${String(i + 1).padStart(2, '0')} · ${c.label}`;
      b.onclick = () => ((t = c.start), (goal = Math.max(0, stops.findIndex((s) => s > t))));
      return b;
    }));
    let uiKey = '';
    function ui() {
      const ch = chapterAt(t), i = tl.chapters.indexOf(ch);
      seen.add(i);
      // Playing: a scroll skips ahead. Resting: it plays the beat waiting here.
      const waiting = t >= stops[goal] && goal < LAST ? scene.beats.find((b) => b.start === stops[goal] + 1) : null;
      const label = t < stops[goal] ? '↓  Skip ahead'
        : !waiting ? '↺  Back to the start'
        : waiting.chapter ? `↓  ${String(tl.chapters.findIndex((c) => c.label === waiting.chapter) + 1).padStart(2, '0')} · ${waiting.chapter}`
        : `↓  “${(waiting.label || waiting.term?.you || '').split('\n')[0]}”`;
      const key = `${i}|${label}|${seen.size}`;
      if (key === uiKey) return;
      uiKey = key;
      [...$('rail').children].forEach((b, j) => {
        b.classList.toggle('on', j === i);
        b.classList.toggle('seen', seen.has(j));
      });
      $('count').textContent = `${i + 1} / ${tl.chapters.length}`;
      $('next').textContent = label;
      $('prev').disabled = t <= 0;
      if (ch && location.hash.slice(1) !== slug(ch.label)) history.replaceState(null, '', `#${slug(ch.label)}`);
    }
    addEventListener('hashchange', () => {
      const c = tl.chapters.find((x) => slug(x.label) === location.hash.slice(1));
      if (c && chapterAt(t) !== c) (t = c.start), (goal = Math.max(0, stops.findIndex((s) => s > t)));
    });

    draw();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
